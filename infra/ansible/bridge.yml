---
- name: Render the haproxy SNI routing table on the shared bridge server
  hosts: node
  gather_facts: false
  become: true
  vars:
    bridge_directory: /opt/remnanode
    bridge_config: "{{ bridge_directory }}/haproxy.cfg"
    # An empty route table is legitimate: the fact below is only defined when
    # the loop runs at least once, so the default must exist for the template.
    bridge_backends: []
  tasks:
    - name: Collect the unique backends
      ansible.builtin.set_fact:
        bridge_backends: "{{ bridge_backends | default([]) + [item.backend] }}"
      loop: "{{ bridge_routes }}"
      when: item.backend not in (bridge_backends | default([]))

    - name: Render the haproxy configuration
      ansible.builtin.copy:
        dest: "{{ bridge_config }}"
        mode: '0644'
        content: |
          global
              log stdout format raw local0
              maxconn 50000

          defaults
              log global
              mode tcp
              option dontlognull
              timeout connect 10s
              timeout client 300s
              timeout server 300s

          frontend tls-in
              bind *:443
              mode tcp
              tcp-request inspect-delay 5s
              tcp-request content accept if { req_ssl_hello_type 1 }
          {% for route in bridge_routes %}    acl sni_{{ loop.index }} req.ssl_sni -i {{ route.sni }}
              use_backend {{ route.backend | replace('[', '') | replace(']', '') | replace(':', '_') | replace('.', '_') }} if sni_{{ loop.index }}
          {% endfor %}    default_backend reject

          {% for backend in bridge_backends %}backend {{ backend | replace('[', '') | replace(']', '') | replace(':', '_') | replace('.', '_') }}
              mode tcp
              server target {{ backend }}

          {% endfor %}backend reject
              mode tcp
              tcp-request content reject
      register: bridge_rendered

    - name: Check the compose stack files
      ansible.builtin.stat:
        path: "{{ bridge_directory }}/{{ item }}"
      loop: ['compose.yml', 'compose.yaml', 'docker-compose.yml']
      register: bridge_compose_files

    - name: Refuse to continue without the compose stack
      ansible.builtin.assert:
        that: bridge_compose_files.results | selectattr('stat.exists') | list | length > 0
        fail_msg: >-
          No compose file in {{ bridge_directory }}. Deploy the haproxy stack first:
          a service named haproxy with ./haproxy.cfg mounted at
          /usr/local/etc/haproxy/haproxy.cfg and port 443 published.
      when: bridge_rendered is changed

    - name: Ensure the haproxy stack is up
      ansible.builtin.command:
        argv: [docker, compose, up, -d]
        chdir: "{{ bridge_directory }}"
      when: bridge_rendered is changed
      changed_when: true

    - name: Validate the haproxy configuration
      ansible.builtin.command:
        argv: [docker, compose, run, --rm, --no-deps, haproxy,
               haproxy, -c, -f, /usr/local/etc/haproxy/haproxy.cfg]
        chdir: "{{ bridge_directory }}"
      when: bridge_rendered is changed
      changed_when: false

    - name: Restart the haproxy container
      ansible.builtin.command:
        argv: [docker, compose, restart]
        chdir: "{{ bridge_directory }}"
      when: bridge_rendered is changed

    - name: Verify the haproxy container is running
      ansible.builtin.command:
        argv: [docker, compose, ps, --status, running, -q]
        chdir: "{{ bridge_directory }}"
      when: bridge_rendered is changed
      register: bridge_running
      changed_when: false
      failed_when: (bridge_running.stdout | trim | length) == 0
