name: remnawave-infrastructure-tests
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  test-runner:
    build: .
    environment:
      BOT_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi'
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: test-db
      POSTGRES_DB: test
      INFRA_ENCRYPTION_KEY: 'MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA='
      INFRA_ARTIFACT_DIR: /tmp/infra-test-artifacts
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@test-db:5432/test
    volumes:
      - .:/app
    extra_hosts:
      - 'panel:127.0.0.1'
    depends_on:
      test-db:
        condition: service_healthy
    command: python -m unittest discover -s tests
